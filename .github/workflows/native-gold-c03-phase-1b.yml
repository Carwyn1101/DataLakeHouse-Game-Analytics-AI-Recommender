name: Bounded native Gold C03 Phase 1B validation

"on":
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: native-gold-c03-phase-1b
  cancel-in-progress: false

jobs:
  gold-c03-phase-1b:
    if: >-
      github.repository == 'Carwyn1101/DataLakeHouse-Game-Analytics-AI-Recommender' &&
      github.event.label.name == 'native-gold-c03-phase-1b-approved' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      github.run_attempt == '1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/gold-c03-phase-1b-native-validation' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == 'a815d6bd9aaa09faf3b8e65ad4ec643abfed062d' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NATIVE_ALLOW_WRITES: "0"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout the exact Owner-approved review head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pilot
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /tests/ci/run_native_gold_c03_phase1b.py
            /tests/ci/gold_c03_phase1b_scenarios.py
          sparse-checkout-cone-mode: false
          clean: false

      - name: Checkout the reviewed PR 14 harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Carwyn1101/DataLakeHouse-Game-Analytics-AI-Recommender
          ref: adc2d56803b9493c2e366f9a31cc3b85ad4e9816
          path: reviewed-harness
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tests/native
          clean: false

      - name: Checkout the reviewed PR 15 isolation driver and MinIO recipe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Carwyn1101/DataLakeHouse-Game-Analytics-AI-Recommender
          ref: ed0937882e505fac6bb658d00cfc858d73fa6332
          path: reviewed-pilot
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /tests/ci/run_native_bronze.py
            /tests/ci/minio-fixture.Dockerfile
          sparse-checkout-cone-mode: false
          clean: false

      - name: Match the native runner Python grammar
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10.22'

      - name: Run the single approved synthetic Gold C03 Phase 1B scenario
        working-directory: reviewed-harness
        shell: bash
        env:
          PILOT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pilot="$GITHUB_WORKSPACE/pilot"
          test "$(git --no-replace-objects -C "$pilot" rev-parse HEAD)" = "$PILOT_HEAD"
          git --no-replace-objects -C "$pilot" show "$PILOT_HEAD:tests/ci/run_native_gold_c03_phase1b.py" |
            python -I -B -
